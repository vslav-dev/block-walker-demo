<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block Walker Demo</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9ec9e8; font: 14px/1.4 system-ui, sans-serif; }
    canvas { display: block; }
    #hud, #status { position: fixed; padding: 8px 12px; color: #fff; background: rgba(20, 24, 30, 0.6); border-radius: 8px; pointer-events: none; }
    #hud { left: 12px; top: 12px; }
    #status { left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 18px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">WASD — move · Mouse — aim · Shift — run · R — new world (seed <span id="seed"></span>)</div>
  <div id="status">Loading…</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
